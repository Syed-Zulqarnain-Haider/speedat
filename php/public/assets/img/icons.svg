<?xml version="1.0" encoding="UTF-8"?>
<!--
  icons.svg — every inline glyph from src/components/Icons.tsx as a <symbol>.

  How to use it: the PHP layout prints this whole file ONCE, inside <body>,
  before anything that references it (readfile() of this path — a read, never
  a write). Then a glyph is one element:

      <svg class="ico" aria-hidden="true"><use href="#i-wa"></use></svg>

  It must be inlined, not linked. Chrome dropped support for external
  <use href="file.svg#id"> entirely, and even where it works `currentColor`
  resolves against the external document, not the page — so a linked sprite
  would give black icons on the navy WhatsApp band. Inlined, every symbol
  inherits the colour of whatever it sits in, exactly as the React
  components do today.

  Each symbol carries the stroke-width / linecap / linejoin the React
  component set on its own <svg>; the shared defaults (viewBox 0 0 24 24,
  fill none, stroke currentColor) are on the symbols too, so a bare
  <svg><use></svg> renders identically to <UI.wa /> without the caller
  repeating them.

  Ids: i-<name> for the UI glyphs (UI.* in Icons.tsx — small glyphs inside
  labels and buttons) and c-<name> for the card icons (CardIcons.*, the
  eight the admin's "icon | Title | Text" lines may name, in
  CARD_ICON_ORDER). The standalone icon-*.svg files beside this one are the
  four the header inlines, kept separately so a phase-3 view can include
  just those without the sprite.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

  <!-- ============ UI glyphs (Icons.tsx: UI) ============ -->

  <!-- A map pin. -->
  <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
    <path d="M12 21s-6-5.3-6-11a6 6 0 0 1 12 0c0 5.7-6 11-6 11z" />
    <circle cx="12" cy="10" r="2.2" />
  </symbol>

  <!-- A weighing scale. -->
  <symbol id="i-scale" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v3M4 7h16M12 6l-5 9h10z" />
    <path d="M6 20h12" />
  </symbol>

  <!-- A clock. -->
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="9" />
    <path d="M12 7v5l3 2" />
  </symbol>

  <!-- A calculator. -->
  <symbol id="i-calc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
    <rect x="5" y="3" width="14" height="18" rx="2" />
    <path d="M8 7h8M8 12h3M13 12h3M8 16h3M13 16h3" />
  </symbol>

  <!-- A speech bubble. -->
  <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
    <path d="M4 5h16v11H9l-5 4z" />
  </symbol>

  <!-- A carton. -->
  <symbol id="i-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
    <path d="M3 8l9-4 9 4v9l-9 4-9-4z" />
    <path d="M3 8l9 4 9-4M12 12v9" />
  </symbol>

  <!-- A rounded speech bubble with a small handset inside ("message us by phone"): original paths, not a trademarked logo. -->
  <symbol id="i-wa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 13.5a2.5 2.5 0 0 1-2.5 2.5H10l-5 4V5.5A2.5 2.5 0 0 1 7.5 3h10A2.5 2.5 0 0 1 20 5.5z" />
    <path d="M9 6.5h1.8l.9 2.2-1.1.7a4.9 4.9 0 0 0 2.2 2.2l.7-1.1 2.2.9v1.8a.9.9 0 0 1-.9.9A7.2 7.2 0 0 1 8.1 7.4a.9.9 0 0 1 .9-.9z" />
  </symbol>

  <!-- A price tag: step 3 of the calculator ("Your price"). -->
  <symbol id="i-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12.5V4h8.5l9.5 9.5-8.5 8.5z" />
    <circle cx="7.5" cy="8.5" r="1.5" />
  </symbol>

  <!-- The tick beside a finished step. -->
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12.5l4.5 4.5L19 7.5" />
  </symbol>

  <!-- The theme toggle while dark mode is on (tap for light). -->
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="4" />
    <path d="M12 2.5V5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" />
  </symbol>

  <!-- The theme toggle while light mode is on (tap for dark). -->
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z" />
  </symbol>

  <!-- A handset: the Call buttons. -->
  <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" />
  </symbol>

  <!-- ============ card icons (Icons.tsx: CardIcons, CARD_ICON_ORDER) ============
       These render with class="ico" on the React side; keep that class on the
       <svg> that wraps the <use> so calculator.css / site.css size them. -->

  <symbol id="c-plane" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 13.5 21 4l-6 17-3-7.5z" />
    <path d="M12 13.5 21 4" />
  </symbol>

  <symbol id="c-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="12" cy="12" r="9" />
    <path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" />
  </symbol>

  <symbol id="c-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <path d="M6 3h8l5 5v13H6z" />
    <path d="M14 3v5h5M9 13h7M9 17h7" />
  </symbol>

  <symbol id="c-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <path d="M3 8l9-4 9 4v9l-9 4-9-4z" />
    <path d="M3 8l9 4 9-4M12 12v9" />
  </symbol>

  <symbol id="c-truck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <path d="M3 6h11v10H3zM14 10h4l3 3v3h-7z" />
    <circle cx="7" cy="17.5" r="1.8" />
    <circle cx="17" cy="17.5" r="1.8" />
  </symbol>

  <symbol id="c-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z" />
    <path d="M9 12l2 2 4-4" />
  </symbol>

  <symbol id="c-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="12" cy="12" r="9" />
    <path d="M12 7v5l3 2" />
  </symbol>

  <symbol id="c-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" />
  </symbol>

</svg>
