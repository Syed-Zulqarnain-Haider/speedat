; Speedat - the PHP settings that travel WITH the release.
;
; ---------------------------------------------------------------------------
; WHY THIS FILE EXISTS AT ALL, NEXT TO .htaccess
; ---------------------------------------------------------------------------
; The same three numbers are written in two places on purpose, because no
; single place is read by every host:
;
;   public/.htaccess    php_value only works under mod_php. LiteSpeed and
;                       PHP-FPM - which is what Hostinger runs - ignore the
;                       whole <IfModule mod_php.c> block SILENTLY. Not an
;                       error, not a warning: the value simply never applies.
;   public/.user.ini    read by the CGI/FastCGI SAPI, which is LiteSpeed and
;                       PHP-FPM. Ignored by mod_php, and ignored by `php -S`,
;                       which is why nothing here changes the dev server.
;
; So a host reads ONE of the two and there is no way to know in advance which.
; If the two files carry different numbers, the site's real body limit is
; whichever file this particular host happened to read - a limit nobody chose.
; deploy/htaccess/user.ini.sample is the annotated copy for pasting into
; hPanel's File Manager and carries the same pair again;
; tests/Core/UserIniTest.php fails if any of the three drift apart.
;
; NOT READ INSTANTLY. PHP caches a .user.ini for user_ini.cache_ttl seconds,
; 300 by default. After an upload, wait five minutes before believing a value
; did not apply. hPanel -> PHP Configuration applies immediately and wins where
; it sets the same directive, so it is the better place for anything it offers.
;
; ONLY PHP_INI_PERDIR AND PHP_INI_ALL DIRECTIVES BELONG HERE. A PHP_INI_SYSTEM
; directive in a .user.ini is not an error - it is ignored, which reads in
; review as a setting that was made. expose_php, max_file_uploads, open_basedir
; and disable_functions are all PHP_INI_SYSTEM: they are deliberately absent,
; and deploy/htaccess/user.ini.sample says so at length.

; --- body size -------------------------------------------------------------
; THE ONLY PLACE A GIANT REQUEST IS REFUSED FOR FREE.
;
; PHP discards an over-sized body before one line of application code runs, so
; the request costs a refusal instead of megabytes of read, buffer and parse on
; a one-core shared plan. Every cap inside the application - Core\Caps, the
; field lengths, the honeypot, the CSRF check - is spent AFTER the bytes have
; already arrived, so none of them defends against the size itself.
;
; 2M / 3M, and the smallness is the point. These were 8M/9M, sized for the
; Excel rate sheet; that feature was removed (owner, 2026-09-27) and NOTHING on
; this site uploads a file any more - no form carries enctype=multipart. The
; largest legitimate body left is the rates editor's few hundred text fields,
; which is tens of kilobytes.
;
; post_max_size STAYS ABOVE upload_max_filesize. post_max_size caps the whole
; body: the file, plus multipart boundaries and headers, plus every other
; field, plus the CSRF token. With the two equal, a file at exactly the
; documented limit makes a body slightly over it and PHP throws the lot away -
; empty $_POST, empty $_FILES, no upload error to report, and a form that
; appears to have done nothing. Core\Upload::problem() says so in plain words
; if it ever happens anyway.
upload_max_filesize = 2M
post_max_size = 3M

; --- how many fields one request may carry ---------------------------------
; PHP does not complain when it hits this limit - it stops parsing and hands
; the handler a TRUNCATED $_POST. The rates editor would save the rows it got
; and silently drop the rest, which is the worst failure this site can have:
; wrong prices, published, with a success message. (It does not: Http\Admin\
; DraftForm compares what arrived with what PHP made of it and refuses the save
; outright. This number is the margin that keeps that refusal from ever having
; to fire, not the thing that makes the editor correct.)
;
; WHAT ACTUALLY POSTS, measured 2026-09-29 against the real document the site
; serves - 11 countries, 3 services, per-kilogram boxes to 25 kg - by counting
; the named controls in every <form> on /admin:
;
;     the largest country row  98     <- the biggest form on the page
;     form#editor              48        (Settings + Website pages)
;     the whole page at once   1173      (only if it were ONE form again, which
;                                         it has not been since 2026-09-28)
;
; This said "roughly four times its worst case" against 1000, and that was
; written when the rates table WAS one form. That form hit 1009 variables the
; day a third service was added, PHP stopped reading at a thousand without a
; word, and the editor could not save at all.
;
; 4000 is deliberate headroom, not caution: max_input_vars counts intermediate
; ARRAY DIMENSIONS as well as values, so PHP's count is always above the number
; of boxes on the screen; a 300 kg cargo threshold or a fourth service
; multiplies a row; and the ceiling costs nothing - a request posting 98
; variables is no cheaper at 1000. Body SIZE is capped by post_max_size above,
; which is unchanged at 3M.
;
; public_html/.htaccess carries the same number for the hosts that read that
; file instead; tests/Core/UserIniTest.php fails if the copies drift apart.
max_input_vars = 4000

; --- error output ----------------------------------------------------------
; PHP_INI_ALL, so the application sets these too - but only once its bootstrap
; has run. This copy is the outer lock, in force for a fatal that happens
; BEFORE any of our code does, which is precisely the error whose message
; contains absolute paths and the location of config.php.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Do NOT point error_log at anything inside public_html. Left unset, errors go
; to the host's own log, which hPanel shows under Files -> Error Log and which
; is not web-readable. An error log in the web root is a published list of your
; file paths and query fragments.
; error_log = /home/uXXXXXXXX/domains/<site>/storage/logs/php-error.log
